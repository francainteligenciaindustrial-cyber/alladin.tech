<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sem conexão — Aladdin Tech</title>
  <meta name="theme-color" content="#09090a">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px; }
    .off { max-width: 420px; display: grid; gap: 14px; justify-items: center; }
    .off img { width: 92px; height: 92px; border-radius: 50%; border: 1px solid var(--gold-line); object-fit: cover; }
    .off h1 { font-weight: 300; font-size: 30px; margin: 6px 0 0; }
    .off p { color: var(--muted); margin: 0; }
  </style>
</head>
<body>
  <main class="off">
    <img src="/img/logo-original.jpg" alt="Aladdin Tech">
    <h1>Você está sem internet</h1>
    <p>Assim que a conexão voltar, é só tocar no botão abaixo. Seus itens da sacola continuam salvos.</p>
    <a class="btn btn-gold" href="/">Tentar de novo</a>
  </main>
</body>
</html>
